<header><small>PERSONAL BACKUP UTILITY</small><h1>MoonTide Backup</h1><p>供擁有者自行使用的機器人資料加密備份工具。</p></header>
<main><h2>用途</h2><p>將已授權管理的 Discord 機器人資料與必要設定先加密，再保存至擁有者的 Google Drive 備份資料夾。透過下載、解密、雜湊比對與資料庫完整性檢查，驗證備份可供還原。</p>
<h2>Google 授權</h2><p>使用擁有者專用的 Google OAuth 用戶端存取既有備份目錄。本工具為個人維運用途，沒有提供公眾登入服務。</p>
<p>請閱讀 <a href="privacy.html">隱私權政策</a>，瞭解資料存取、保存及撤銷授權方式。</p></main>
